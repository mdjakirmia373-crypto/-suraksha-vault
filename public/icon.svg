<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="50%" stop-color="#00D2D2"/>
      <stop offset="100%" stop-color="#061D15"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A14"/>
      <stop offset="100%" stop-color="#091424"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00FF87" stroke-width="6" opacity="0.4" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#shieldGrad)" stroke-width="8" opacity="0.8"/>

  <!-- Shield Shape -->
  <path d="M256 90 L380 140 C380 270 330 365 256 422 C182 365 132 270 132 140 Z" 
        fill="#04121B" stroke="#00FF87" stroke-width="12" filter="url(#glow)"/>

  <!-- Inner Shield accent -->
  <path d="M256 120 L350 160 C350 260 310 340 256 390 C202 340 162 260 162 160 Z" 
        fill="url(#shieldGrad)" opacity="0.2"/>

  <!-- Lock Emblem in center -->
  <!-- Lock shackle -->
  <path d="M216 230 V195 C216 173 234 155 256 155 C278 155 296 173 296 195 V230" 
        fill="none" stroke="#00FF87" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Lock body -->
  <rect x="190" y="230" width="132" height="110" rx="20" fill="#00FF87"/>
  
  <!-- Keyhole -->
  <circle cx="256" cy="275" r="12" fill="#040C16"/>
  <path d="M251 275 L247 312 H265 L261 275 Z" fill="#040C16"/>
</svg>
